<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conversor de colunas</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .info { color: #666; font-size: 13px; }
  .controls { margin: 14px 0; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .controls input[type=text] { width: 50px; padding: 4px; }
  .controls select { padding: 4px; }
  button { padding: 8px 14px; cursor: pointer; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 300px; display: flex; flex-direction: column; }
  .col label { font-weight: 600; margin-bottom: 4px; }
  textarea { width: 100%; height: 360px; box-sizing: border-box; font-family: Consolas, monospace; font-size: 13px; padding: 8px; }
</style>
</head>
<body>
<h1>Conversor de colunas</h1>
<p class="info">Cole o resultado do DBeaver, Excel ou SQL Developer na entrada. O resultado aparece na saída, pronto para copiar.</p>

<div class="controls">
  <label>Modo:
    <select id="mode">
      <option value="linha">uma linha por linha (todas as colunas)</option>
      <option value="pares">pares nome:tipo</option>
    </select>
  </label>
  <label>Separador: <input type="text" id="sep" value=":"></label>
  <label><input type="checkbox" id="lower" checked> minúsculas</label>
  <label><input type="checkbox" id="skipHeader" checked> ignorar cabeçalho (só modo pares)</label>
  <button id="copy">Copiar resultado</button>
  <span class="info" id="count"></span>
</div>

<div class="row">
  <div class="col">
    <label for="input">Entrada</label>
    <textarea id="input" placeholder="Cole aqui..."></textarea>
  </div>
  <div class="col">
    <label for="output">Saída</label>
    <textarea id="output" readonly></textarea>
  </div>
</div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const mode = document.getElementById('mode');
  const sep = document.getElementById('sep');
  const lower = document.getElementById('lower');
  const skipHeader = document.getElementById('skipHeader');
  const copyBtn = document.getElementById('copy');
  const count = document.getElementById('count');

  // Tabs keep empty cells in place; spaces only split when the line has no tabs
  function splitCells(raw) {
    return raw.includes('\t')
      ? raw.split('\t').map(c => c.trim())
      : raw.trim().split(/\s+/);
  }

  function normalize(text) {
    return lower.checked ? text.toLowerCase() : text;
  }

  function convert() {
    const result = [];
    for (const raw of input.value.split(/\r?\n/)) {
      if (!raw.trim()) continue;
      const cells = splitCells(raw);

      if (mode.value === 'linha') {
        // Every cell of the line, in order, joined by the separator
        result.push(cells.map(normalize).join(sep.value));
        continue;
      }

      // Pares: each consecutive (nome, tipo) couple becomes one line
      for (let i = 0; i + 1 < cells.length; i += 2) {
        const name = cells[i];
        const type = cells[i + 1];
        if (!name || !type) continue;
        if (skipHeader.checked && name.toUpperCase() === 'COLUMN_NAME') continue;
        result.push(normalize(name) + sep.value + normalize(type));
      }
    }
    output.value = result.join('\n');
    count.textContent = result.length + (mode.value === 'linha' ? ' linha(s)' : ' coluna(s)');
  }

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.value);
    } catch (e) {
      output.select();
      document.execCommand('copy');
    }
    copyBtn.textContent = 'Copiado!';
    setTimeout(() => copyBtn.textContent = 'Copiar resultado', 1200);
  });

  [input, sep].forEach(el => el.addEventListener('input', convert));
  [mode, lower, skipHeader].forEach(el => el.addEventListener('change', convert));
  convert();
</script>
</body>
</html>
